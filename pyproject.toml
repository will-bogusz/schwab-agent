[project]
name = "schwab-agent"
version = "0.2.0"
description = "Ergonomic CLI for the Schwab API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1.2",
    "httpx>=0.27.0",
    "schwab-py>=1.5.1",
]

[project.scripts]
schwab = "schwab_agent.cli:main"
schwab-api = "schwab_agent.api:main"
schwab-server = "schwab_agent.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
