[project]
name = "schwab-agent"
version = "0.2.0"
description = "Ergonomic CLI for the Schwab API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1.2",
    "httpx>=0.27.0",
    "playwright>=1.45.0",
    "schwab-py>=1.5.1",
]

[project.scripts]
schwab = "schwab_agent.cli:main"
schwab-api = "schwab_agent.api:main"
schwab-auth-keepalive = "schwab_agent.browser_auth:keepalive_main"
schwab-browser-auth = "schwab_agent.browser_auth:main"
schwab-secrets = "schwab_agent.browser_auth:secrets_main"
schwab-server = "schwab_agent.server:main"
schwab-refresh = "schwab_agent.server:refresh_main"
schwab-stream-cache = "schwab_agent.stream_cache:main"
schwab-token-sync = "schwab_agent.remote_authority:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
